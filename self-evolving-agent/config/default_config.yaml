system:
  name: "self-evolving-coding-agent"
  max_consecutive_failures: 3
  max_proposals_per_cycle: 3
  evaluation_threshold: 0.0

agent:
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.3

storage:
  traces_dir: "./data/traces"
  proposals_dir: "./data/proposals"
  comparisons_dir: "./data/comparisons"
  versions_dir: "./data/versions"

protected_prompts:
  - "safety_prompt"
  - "identity_prompt"
