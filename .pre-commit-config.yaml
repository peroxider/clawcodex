repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: docs-check
        name: docs check
        entry: python scripts/ci/docs_check.py
        language: python
        files: '(^docs/.*|README\.md$|.*\.(md|mdx|rst)$)'
