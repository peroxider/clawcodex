  # ============================================================
  # WEAK tier — 本地可跑的小模型
  # ============================================================

  - model: qwen3-coder-next:32b-active-moe
    provider: openai_compatible     # via ollama / vllm
    tier: weak
    auto_tier: true                # 每次模型升级需重新校准
    confidence: 0.78
    metrics:
      swe_bench_verified: 0.443
      livecodebench: 0.417
      mt_bench: 0.625
    probe_score: null
    capability_flags:
      tool_use: true                # 支持 tool use 但精度有限
      json_mode: true
      extended_thinking: false
      adaptive_thinking: false
      vision: false
      audio: false
      parallel_tool_calls: false    # 不支持并发 tool calls
      long_context_1m: false
    reasoning_channel_mapping:
      reasoning_content: ""
      thinking_blocks: ""
    context_window: 32000
    max_output_tokens: 4096
    probe_suite: tests/capability_probe/probe_spec.yaml
    anti_hacking:
      knowing_evaluated_variant: true
      judge_blind: true
      probe_rotation_days: 14       # MoE 变体多，频繁轮换
    cadence:
      re_probe_after_days: 14
      re_probe_on_drift: true
    notes: |
      Qwen3-Coder-Next 32B-active MoE（阿里 2026-Q2）。
      本地可跑（vllm 单 4090）；narrow typed 工具集必备；
      SWE-bench 44.3% 不代表不能用，narrow/well-scoped 任务上仍可达 70%+；
      open-ended 任务需 strong tier 工具与权限约束。