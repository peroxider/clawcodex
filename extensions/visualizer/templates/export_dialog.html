{# Export Dialog — modal for exporting session data in various formats #}
<div id="export-dialog" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>📥 Export Session</h3>
        <p>Select export format:</p>
        <div class="export-format-options">
            <label class="export-option">
                <input type="radio" name="export-format" value="json" checked>
                <span>JSON</span>
                <small>Full session data</small>
            </label>
            <label class="export-option">
                <input type="radio" name="export-format" value="svg">
                <span>SVG</span>
                <small>Chart as vector</small>
            </label>
            <label class="export-option">
                <input type="radio" name="export-format" value="png">
                <span>PNG</span>
                <small>Chart as image</small>
            </label>
            <label class="export-option">
                <input type="radio" name="export-format" value="pdf">
                <span>PDF</span>
                <small>Printable report</small>
            </label>
        </div>
        <div class="modal-actions">
            <button onclick="doExport()" class="btn btn-primary">Export</button>
            <button onclick="closeExportDialog()" class="btn">Cancel</button>
        </div>
    </div>
</div>

<style>
    .export-format-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 16px 0;
    }
    .export-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        cursor: pointer;
        transition: border-color 0.2s;
    }
    .export-option:hover { border-color: var(--text-accent); }
    .export-option input[type="radio"] { accent-color: var(--text-accent); }
    .export-option span { font-weight: 500; }
    .export-option small { color: var(--text-secondary); font-size: 11px; }
</style>

<script>
    let _exportSessionId = null;

    function openExportDialog(sessionId) {
        _exportSessionId = sessionId;
        document.getElementById('export-dialog').style.display = 'flex';
    }

    function closeExportDialog() {
        document.getElementById('export-dialog').style.display = 'none';
        _exportSessionId = null;
    }

    async function doExport() {
        if (!_exportSessionId) return;
        const format = document.querySelector('input[name="export-format"]:checked')?.value || 'json';
        try {
            const resp = await fetch(`/api/viz/sessions/${_exportSessionId}/export?format=${format}`);
            if (!resp.ok) throw new Error(`Export failed: ${resp.status}`);
            const blob = await resp.blob();
            const filename = `${_exportSessionId}.${format}`;
            if (typeof VizUtils !== 'undefined') {
                VizUtils.downloadBlob(blob, filename);
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        } catch (e) {
            alert('Export failed: ' + e.message);
        }
        closeExportDialog();
    }

    window.openExportDialog = openExportDialog;
    window.closeExportDialog = closeExportDialog;
    window.doExport = doExport;
</script>
