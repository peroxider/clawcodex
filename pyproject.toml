[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawcodex-dev-mind"
# version is dynamic - computed from date via clawcodex_ext._version.__version__
dynamic = ["version"]
description = "A production-oriented Python rebuild of Claude Code — real architecture, reliable CLI agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11, <3.14"
authors = [
    {name = "Claw Codex Team"}
]
keywords = ["claude", "cli", "ai", "llm", "anthropic", "openai", "glm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "anthropic",
    "openai",
    "zhipuai",
    "python-dotenv",
    "rich",
    "prompt-toolkit",
    "tiktoken>=0.7.0",
    "textual>=0.79",
    # YAML frontmatter parser (SKILL.md, agent files, output styles).
    # Required for nested structures like ``hooks:`` and ``shell:`` to
    # round-trip through ``src.skills.frontmatter.parse_frontmatter``.
    "PyYAML>=6.0",
    # gitwildmatch path matching for conditional-skill ``paths:`` rules.
    # The TS port uses the `ignore` library; ``pathspec`` is the Python
    # equivalent (full ``**`` recursion + anchoring + negation).
    "pathspec>=0.11",
    # Ch16 Phase 0: WebSocket client/server for the CCR bridge (Bridge v2,
    # Direct Connect, Remote Session). The 14.0 lower bound is required for
    # the new asyncio API's ``additional_headers`` kwarg; v12/v13 use
    # ``extra_headers`` and would TypeError against our planned API.
    "websockets>=14.0",
    # Ch16 Phase 0: SSE consumer for the CCR v2 SSE read transport. ``httpx``
    # itself is transitively available via the ``anthropic`` SDK.
    "httpx-sse>=0.4",
    # Open source replacement: Pydantic Settings for type-safe config
    "pydantic-settings>=2.0.0",
    # Open source replacement: python-frontmatter for parsing SKILL.md / agent files
    "python-frontmatter>=1.0.0",
    # Open source replacement: tree-sitter-bash for Bash AST parsing
    "tree-sitter>=0.25.0",
    "tree-sitter-bash>=0.25.0",
    # Open source replacement: GitPython for Git operations
    "GitPython>=3.1.0",
    # Open source replacement: LiteLLM for unified Provider layer
    "litellm>=1.0.0",
    # Open source replacement: Pluggy for Hook system
    "pluggy>=1.0.0",
    # Open source replacement: Outlines for structured output
    "outlines>=0.0.80",
    # Image decode/resize/encode for the FileReadTool image pipeline (port
    # of TS imageResizer.ts which uses sharp). Pillow has pure-Python wheels
    # for all platforms and covers PNG/JPEG/GIF/WebP and palette quantization.
    # Without this, oversized images get rejected instead of downscaled.
    "Pillow>=10.0",
    # upstream-sync: CLI framework
    "typer[all]>=0.12.0",
    # F-??: shell tab completion for the ``clawcodex-dev`` entrypoint
    "argcomplete>=3.5.0",
    "jinja2>=3.1.0",
    # F-88: At-rest encryption of ~/.clawcodex/auth.json via AES-256-GCM
    # (machine-id derived key, transparent encrypt/decrypt in codex_store).
    "cryptography>=42.0.0",
    # F-91~F-95: Multi-Session Visualizer backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
    # ``pyproject.toml`` declares ``asyncio_mode = "auto"`` (below) which
    # requires the pytest-asyncio plugin. Without it, async tests fail at
    # run time with "async def functions are not natively supported."
    "pytest-asyncio>=1.3.0",
    # F-73: coverage report generation for CI visibility. The current rollout
    # intentionally does not enforce a minimum coverage percentage.
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "mypy>=1.13.0",
    "import-linter>=2.0",
    "pexpect>=4.9.0",
    "lark-oapi==1.7.0",
    "qrcode==7.4.2",
]
# F-62 Chrome browser automation. ``playwright`` drives a real
# headless Chromium; ``pillow`` composites screenshot frames into
# the operation GIF. ``mcp`` is the upstream SDK for the
# Chrome DevTools MCP server backend. Without this extra, the
# chrome tools still register — they degrade to a
# NullChromeController that returns an install-hint error on
# every call.
chrome = [
    "playwright>=1.40",
    "Pillow>=10.0",
]
# F-138 Layer-4 SMT solver. Installing this extra enables the
# Z3-backed Logical Kanban adapter (``smt-z3``) that derives pass/fail
# decisions from satisfiability of the proposal under the encoded
# Layer-1 invariants. Without ``z3-solver`` the adapter reports itself
# as unavailable and the pipeline falls back to Layer 1.
lkb-smt = [
    "z3-solver>=4.12",
]
# F-138 Layer-3 ASP solver. Installing this extra enables the
# clingo-backed Logical Kanban adapter (``asp-clingo``) that derives
# pass/fail decisions from satisfiability of integrity-constraint-encoded
# proposals against the snapshot. Without ``clingo`` the adapter reports
# itself as unavailable and the pipeline falls back to Layer 1.
lkb-asp = [
    "clingo>=5.8",
]
# F-138 Layer-5 ATP/TPTP solver. The adapter is always available
# because the refutation prover lives in-process at
# ``clawcodex_ext/logical_kanban/solver_atp.py``. The extra is kept
# for symmetry with ``lkb-smt`` / ``lkb-asp`` so ``pip install -e
# ".[lkb-atp]"`` is a meaningful command-line target — the adapter is
# exposed regardless of whether the extra is installed, but listing it
# in ``pip install`` documents the intent of pulling in the F-138
# Layer-5 backend explicitly. Future swaps to a subprocess ATP
# (``vampire``, ``eprover``) can populate this list.
lkb-atp = [
]
feishu = [
    "lark-oapi==1.7.0",
    "qrcode==7.4.2",
]
# ``all`` is the catch-all extra consumed by ``install.sh`` (one-click
# installer). NOTE: an earlier draft used a self-reference
# (``all = ["clawcodex-dev-mind[dev]"]``) which deadlocks editable
# installs because pip/setuptools wait for the package to exist on disk to
# read its metadata, but the package is what's being built. List the deps
# explicitly instead. Keep in sync with ``dev`` above.
all = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "mypy>=1.13.0",
    "import-linter>=2.0",
    "lark-oapi==1.7.0",
    "qrcode==7.4.2",
    # F-138 Layer-4 SMT solver; kept in ``all`` so the one-click installer
    # surfaces the full solver pipeline.
    "z3-solver>=4.12",
    # F-138 Layer-3 ASP solver; kept in ``all`` so the one-click installer
    # surfaces the full solver pipeline alongside the SMT extra.
    "clingo>=5.8",
]

[project.scripts]
clawcodex-dev = "clawcodex_ext.cli.main:main"

[project.urls]
Homepage = "https://github.com/agentforce314/clawcodex"
Repository = "https://github.com/agentforce314/clawcodex"
Documentation = "https://github.com/agentforce314/clawcodex#readme"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Prepend the project root so pytest imports the worktree's ``src/`` rather
# than the parent repo's editable-install mapping.
pythonpath = ["."]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "linux_only: marks tests that require Linux (auto-skipped on macOS/Windows)",
]
filterwarnings = [
    # Ch16 Phase 0 (WI-0.2/0.3) + ch01 round-2 P3: scripts/audit/remote_runtime
    # emits DeprecationWarnings on import (the remote_runtime stub was
    # relocated from src/ to scripts/audit/ when audit scaffolding moved).
    # Existing tests still exercise that module; suppress so
    # ``pytest -W error::DeprecationWarning`` doesn't break the pre-existing
    # test suite.
    "ignore::DeprecationWarning:scripts.audit.remote_runtime",
]

[tool.setuptools.dynamic]
version = {attr = "clawcodex_ext._version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".venv",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "src/upstream",
    "patches",
    "claude-code-wiki",
    "demos",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Start with correctness-oriented rules that can be blocking without forcing
# a repo-wide style cleanup. Formatting is still checked on changed files in CI.
select = ["E9", "F63", "F7", "F82"]

# F-152 (Bounded Scheduling Solver) — OR-Tools meta-package 安全守门。
# OR-Tools wheel 打包了 6 个污染 LKB 的子模块（routing / linear_solver /
# constraint_solver / algorithms / graph / ml），其中 ml/routing 含启发式 +
# ML 黑盒，违反项目"不引入额外模型"红线。LKB 只允许引入
# ortools.sat.python.cp_model 一个子模块做 CP-SAT 约束规划。
#
# 此规则在 CI lint job（.github/workflows/ci.yml:30-47）自动运行，违规导入
# 会被 ruff 拒绝。详见 docs/feature_plan/09-logical-kanban/f-152-bounded-scheduling-solver.md
# Phase 1（方案 A — lint 守门）。
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ortools.routing".msg = "F-152: Only ortools.sat.python.cp_model is allowed (OR-Tools routing 含 ML 启发式)."
"ortools.linear_solver".msg = "F-152: Only ortools.sat.python.cp_model is allowed."
"ortools.constraint_solver".msg = "F-152: Only ortools.sat.python.cp_model is allowed (constraint_solver 是 VRP)."
"ortools.algorithms".msg = "F-152: Only ortools.sat.python.cp_model is allowed."
"ortools.graph".msg = "F-152: Only ortools.sat.python.cp_model is allowed (graph 用 NetworkX 已覆盖)."
"ortools.ml".msg = "F-152: 违反项目'不引入额外 ML 模型'红线."

[tool.ruff.lint.per-file-ignores]
# These ``src`` modules are intentional lazy facades for implementations that
# now live under ``clawcodex_ext``. Their public names are materialized via
# module-level ``__getattr__``, so Ruff cannot see them as static definitions.
"src/command_system/*.py" = ["F822"]
"src/context_system/prompt_assembly.py" = ["F822"]
"src/entrypoints/*.py" = ["F822"]
"src/permissions/cycle.py" = ["F822"]
"src/repl/*.py" = ["F822"]
"src/tui/**/*.py" = ["F822"]

[tool.coverage.run]
branch = true
source = ["src", "clawcodex_ext", "extensions"]
omit = [
    "src/upstream/*",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.mypy]
python_version = "3.10"
platform = "linux"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = false
exclude = [
    "^src/upstream/",
    "^patches/",
    "^claude-code-wiki/",
    "^demos/",
]

# F-73: mypy is a blocking CI gate again. These modules are the explicit
# historical debt baseline discovered while reopening the gate; keep this list
# shrinking as the older runtime, TUI, orchestration, and facade layers are
# typed. Modules outside this baseline fail CI on new type errors.
[[tool.mypy.overrides]]
module = [
    "clawcodex_ext.agent.*",
    "clawcodex_ext.away_summary.*",
    "clawcodex_ext.cli.*",
    "clawcodex_ext.command_system.*",
    "clawcodex_ext.context_system.*",
    "clawcodex_ext.cron_system.*",
    "clawcodex_ext.dreaming.*",
    "clawcodex_ext.entrypoints.*",
    "clawcodex_ext.frontend.*",
    "clawcodex_ext.hooks.*",
    "clawcodex_ext.memory.*",
    "clawcodex_ext.permissions.*",
    "clawcodex_ext.providers.*",
    "clawcodex_ext.repl.*",
    "clawcodex_ext.runtime.*",
    "clawcodex_ext.skills.*",
    "clawcodex_ext.tool_system.*",
    "clawcodex_ext.tui.*",
    "clawcodex_ext.utils.*",
    "extensions.capabilities.*",
    "extensions.orchestrator.*",
    "extensions.sop_converter.*",
    "extensions.remote_api.*",
    "extensions.visualizer.*",
    "src",
    "src.agent.*",
    "src.bridge.*",
    "src.hooks.*",
    "src.memdir.*",
    "src.permissions.*",
    "src.providers.*",
    "src.query.*",
    "src.remote.*",
    "src.server.*",
    "src.services.*",
    "src.tasks.*",
    "src.token_estimation",
    "src.tool_system.*",
    "src.types.*",
    "src.upstreamproxy.*",
    "telemetry.*",
]
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
# TODO: 正式发布前将 "telemetry*" 从 include 中去除，
#       使 telemetry 包外置为独立可选的 pip install 依赖，
#       不作为 clawcodex 主包的强制组成部分。
include = ["src*", "clawcodex_ext*", "extensions*", "telemetry*"]
exclude = [
    "src/upstream*",
]

# Excluded paths:
#   src/upstream*        — vendor snapshot (git archive artifact), not runtime
#                         see: src/upstream/PHASE1_SKELETON.txt

# ---------------------------------------------------------------------------
# import-linter — DAG-leaf enforcement for src/bootstrap/state.py
# ---------------------------------------------------------------------------
# Mirrors the TS ``bootstrap-isolation`` ESLint rule (typescript/src/.eslintrc).
# Bootstrap state is a DAG leaf — it cannot import from feature subsystems
# (``src/tui``, ``src/repl``, ``src/agent``, ``src/services``, ``src/query``,
# ``src/context_system``, ``src/permissions``, ``src/command_system``,
# ``src/tool_system``, ``src/coordinator``). The contract below enforces
# this on every commit when ``lint-imports`` runs in CI.
#
# To run locally: ``pip install -e ".[dev]" && lint-imports``.
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "bootstrap/state.py cannot import from feature subsystems (DAG-leaf rule)"
type = "forbidden"
source_modules = ["src.bootstrap.state"]
forbidden_modules = [
    "src.tui",
    "src.repl",
    "src.agent",
    "src.services",
    "src.query",
    "src.context_system",
    "src.permissions",
    "src.command_system",
    "src.tool_system",
    "src.coordinator",
    "src.providers",
    "src.tasks",
    "src.bridge",
    "src.remote",
    "src.skills",
]
# ch01 round-2 P3: ``src.commands`` was removed (audit-only module relocated
# to ``scripts/audit/commands.py``). The production command surface is
# ``src/command_system/`` which is already covered by ``src.command_system``.

# TODO: add a positive-allowlist (kept) contract restricting bootstrap to
# import only from ``src.utils.signal`` and a small set of leaf utilities.
# The forbidden contract above misses the case where someone adds
# ``from src.utils.tui_helpers import foo`` to bootstrap — ``src.utils`` is
# not in the blocklist. ``import-linter`` doesn't have a perfect positive-
# allowlist primitive; the closest is the ``independence`` contract or a
# custom contract. Plan §P1.0 acknowledged the ~30 min research cost.
# Tracking as a Phase-2 follow-up.
