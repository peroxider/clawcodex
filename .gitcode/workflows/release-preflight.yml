name: release-preflight

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to validate
        required: false
        default: dev-decoupling-refactor-b24b8cb

jobs:
  release-preflight:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - uses: setup-python@0.0.1
        with:
          python-version: "3.11"
      - name: Install uv and dependencies
        run: |
          set -euo pipefail
          cd repo_workspace
          python -m pip install --upgrade pip uv
          uv sync --locked --python 3.11 --extra dev
      - name: Full validation before release
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GLM_API_KEY: ""
          ZHIPUAI_API_KEY: ""
          COVERAGE_FAIL_UNDER: "0"
        run: |
          set -euo pipefail
          cd repo_workspace
          TARGET_REF="${TARGET_REF:-dev-decoupling-refactor-b24b8cb}"
          git fetch --tags --force
          git fetch origin "$TARGET_REF" --depth=1 || true
          TARGET_BRANCH="${TARGET_REF#refs/heads/}"
          git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" --depth=1 || true
          if git rev-parse -q --verify "${TARGET_REF}^{commit}" >/dev/null; then
            git checkout --detach "$TARGET_REF"
          elif git rev-parse -q --verify "origin/${TARGET_BRANCH}^{commit}" >/dev/null; then
            git checkout --detach "origin/${TARGET_BRANCH}"
          elif git rev-parse -q --verify "refs/tags/${TARGET_REF}^{commit}" >/dev/null; then
            git checkout --detach "refs/tags/${TARGET_REF}"
          else
            echo "Could not resolve release preflight target ref: ${TARGET_REF}" >&2
            exit 1
          fi
          source .venv/bin/activate
          python -m ruff check \
            scripts/ci/docs_check.py \
            scripts/ci/gitcode_release.py \
            scripts/ci/preflight.py \
            scripts/ci/supply_chain_audit.py \
            scripts/ci/env_loader.py \
            scripts/ci/local_publish.py
          python -m ruff format --check \
            scripts/ci/docs_check.py \
            scripts/ci/gitcode_release.py \
            scripts/ci/preflight.py \
            scripts/ci/supply_chain_audit.py \
            scripts/ci/env_loader.py \
            scripts/ci/local_publish.py
          python -m mypy src clawcodex_ext extensions || true
          python -m pytest \
            tests/fast \
            tests/config/test_config.py \
            tests/config/test_config_system.py \
            tests/config/test_effort.py \
            tests/model \
            tests/utils/test_combined_abort_signal.py \
            tests/input/test_format.py \
            tests/input/test_frontmatter_adapter.py \
            tests/permissions/test_permission_modes.py \
            tests/hooks/test_hook_config.py \
            tests/skills/test_skills_frontmatter_yaml.py \
            tests/bridge/test_jwt_utils.py \
            tests/ci/test_gitcode_release.py \
            tests/agent/test_agent_smoke_no_live_key.py \
            tests/orchestrator/test_local_tracker_parser.py \
            tests/orchestrator/test_orchestrator_f39_intent.py \
            tests/orchestrator/test_orchestrator_f49_transcript.py \
            tests/orchestrator/test_orchestrator_f49_resume.py \
            tests/orchestrator/test_orchestrator_workspace_hooks.py \
            tests/test_visualizer/test_orchestrator_link.py \
            -q \
            --cov=extensions.orchestrator \
            --cov=clawcodex_ext \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${COVERAGE_FAIL_UNDER}"
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python -m venv .release-smoke
          . .release-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          clawcodex-dev --help
