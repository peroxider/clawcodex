name: release-preflight

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to validate
        required: false
        default: dev-decoupling-refactor-b24b8cb

jobs:
  release-preflight:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - uses: setup-python@0.0.1
        with:
          python-version: "3.11"
      - name: Derive RELEASE_TAG from target ref (if version tag)
        run: |
          if [[ "$TARGET_REF" == v* ]]; then
            echo "RELEASE_TAG=$TARGET_REF" >> "$GITHUB_ENV"
            echo "Set RELEASE_TAG to $TARGET_REF from target ref"
          else
            echo "Target ref is not a version tag — version will use dynamic CalVer"
          fi
      - name: Install uv and dependencies
        run: |
          set -euo pipefail
          cd repo_workspace
          python -m pip install --upgrade pip uv
          uv sync --locked --python 3.11 --extra dev
      - name: Bump static version refs to today's CalVer date
        run: |
          set -euo pipefail
          cd repo_workspace
          source .venv/bin/activate
          python scripts/ci/bump_version.py --apply
      - name: Verify installer version consistency
        run: |
          set -euo pipefail
          cd repo_workspace
          # After bump_version.py --apply, all four version sources must
          # agree.  This catches a missed PATCHER entry, a regex drift, or
          # a manual edit to one installer that the bump didn't reach.
          extract() {
            local file="$1" pattern="$2"
            if [ ! -f "$file" ]; then
              echo "MISSING: $file" >&2
              return 1
            fi
            grep -oE "$pattern" "$file" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1
          }
          SH_INSTALLER=$(extract install.sh 'readonly INSTALLER_VERSION="[0-9]+\.[0-9]+\.[0-9]+"')
          SH_CLAW=$(extract install.sh 'readonly CLAWCODEX_VERSION="[0-9]+\.[0-9]+\.[0-9]+"')
          PS_INSTALLER=$(extract install.ps1 "InstallerVersion\s+=\s+'[0-9]+\.[0-9]+\.[0-9]+'")
          PS_CLAW=$(extract install.ps1 "ClawCodexVersion\s+=\s+'[0-9]+\.[0-9]+\.[0-9]+'")
          PY_VER=$(.venv/bin/python -c "from clawcodex_ext._version import __version__; print(__version__)")
          echo "install.sh    INSTALLER_VERSION = $SH_INSTALLER"
          echo "install.sh    CLAWCODEX_VERSION = $SH_CLAW"
          echo "install.ps1   InstallerVersion  = $PS_INSTALLER"
          echo "install.ps1   ClawCodexVersion  = $PS_CLAW"
          echo "clawcodex_ext __version__       = $PY_VER"
          if [ -z "$SH_INSTALLER" ] || [ -z "$SH_CLAW" ] || [ -z "$PS_INSTALLER" ] || [ -z "$PS_CLAW" ] || [ -z "$PY_VER" ]; then
            echo "One or more version sources are empty — bump_version.py may have failed to update install.ps1." >&2
            exit 1
          fi
          if [ "$SH_INSTALLER" != "$SH_CLAW" ] || [ "$SH_INSTALLER" != "$PS_INSTALLER" ] || [ "$SH_INSTALLER" != "$PS_CLAW" ] || [ "$SH_INSTALLER" != "$PY_VER" ]; then
            echo "Version mismatch across installers.  bump_version.py did not sync them." >&2
            exit 1
          fi
          echo "All four installer sources agree on version $SH_INSTALLER"
      - name: Pre-flight bump_version dry-run consistency
        run: |
          set -euo pipefail
          cd repo_workspace
          source .venv/bin/activate
          # bump_version.py dry-run is the default (no flag); this
          # fail-fasts on PATCHER regex drift / missed file before the
          # destructive --apply step below.  Reports "will change X to Y"
          # but does NOT modify any file.
          python scripts/ci/bump_version.py
      - name: Install wheel + post-install CLI smoke
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          cd repo_workspace
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python -m venv .release-smoke
          . .release-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          # CLI smoke — grep for stable substrings to avoid CalVer / HOME
          # drift; full output is discarded (CI logs capture it).
          clawcodex-dev --version 2>&1 | grep -qE '^claw-codex version [0-9]+\.[0-9]+\.[0-9]+'
          clawcodex-dev --help 2>&1 | grep -qi 'usage: clawcodex-dev'
          clawcodex-dev doctor 2>&1 | grep -q '^version:'
          clawcodex-dev telemetry status 2>&1 | grep -qi 'telemetry status'
          clawcodex-dev provider list 2>&1 | grep -qE '(anthropic|openai|glm|zhipuai)'
          clawcodex-dev model list 2>&1 | grep -qi '^models:'
          # Orchestrator offline subcommands — exit 0 with no daemon,
          # no live key, no GitHub/GitCode token.
          clawcodex-dev orchestrator workflow list-templates 2>&1 | grep -qi 'workflow'
          clawcodex-dev orchestrator workflow init \
            --template workflow-local \
            --non-interactive \
            --output /tmp/cx-preflight-wf.md
          clawcodex-dev orchestrator server status
          clawcodex-dev orchestrator server stop --all
      - name: install.sh doctor + version sanity
        run: |
          set -euo pipefail
          cd repo_workspace
          # install.sh: syntax + offline diagnostic + version print.
          # `cmd_doctor` is read-only (line 1601) and exits 0 on a clean
          # environment.
          bash -n install.sh
          bash install.sh --version | grep -qE 'INSTALLER_VERSION'
          bash install.sh doctor
          # install.ps1: no pwsh on this runner, so use a regex sanity
          # check to confirm the PowerShell script still exposes the
          # version variables the bump_version PATCHER expects.
          head -50 install.ps1 | grep -q 'InstallerVersion'
          head -50 install.ps1 | grep -q 'ClawCodexVersion'
