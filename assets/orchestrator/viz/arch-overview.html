<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestrator 架构总览</title>
<style>
  :root {
    --bg: #0a0e14;
    --bg-elevated: #131820;
    --bg-card: #181e29;
    --border: #2a3142;
    --border-strong: #3a4252;
    --text-primary: #e4e7ec;
    --text-secondary: #8a92a3;
    --text-muted: #5a6173;
    --accent: #00d4aa;
    --accent-dim: #00a886;
    --accent-glow: rgba(0, 212, 170, 0.15);
    --info: #3b82f6;
    --warning: #f59e0b;
    --danger: #ef4444;
    --neutral: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 32px 24px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,212,170,0.04), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(59,130,246,0.04), transparent 50%);
  }
  .header { max-width: 1280px; margin: 0 auto 24px; }
  .header h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .header .sub { color: var(--text-secondary); font-size: 14px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--accent-glow); color: var(--accent);
    font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
    text-transform: uppercase;
    border: 1px solid rgba(0,212,170,0.3);
    margin-bottom: 12px;
  }
  .badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .container { max-width: 1280px; margin: 0 auto; }
  .arch-svg {
    width: 100%; height: auto; display: block;
  }
  .layer-card {
    fill: var(--bg-card);
    stroke: var(--border);
    stroke-width: 1;
    transition: all 200ms ease-out;
  }
  .layer-card:hover { stroke: var(--accent); }
  .layer-title {
    fill: var(--text-primary);
    font-family: -apple-system, 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
  }
  .layer-sub {
    fill: var(--text-secondary);
    font-family: -apple-system, 'Inter', sans-serif;
    font-size: 11px;
  }
  .component-rect {
    fill: var(--bg-elevated);
    stroke: var(--border-strong);
    stroke-width: 1;
    rx: 6;
    transition: all 200ms ease-out;
  }
  .component-rect:hover {
    stroke: var(--accent);
    fill: rgba(0,212,170,0.05);
  }
  .component-label {
    fill: var(--text-primary);
    font-family: -apple-system, 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    text-anchor: middle;
  }
  .component-sub {
    fill: var(--text-muted);
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 9px;
    text-anchor: middle;
  }
  .conn-line {
    stroke: var(--border-strong);
    stroke-width: 1.5;
    fill: none;
  }
  .conn-active {
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 6 4;
    fill: none;
    animation: dash 1.5s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  .conn-label {
    fill: var(--text-muted);
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 9px;
  }
  .phase-arrow {
    fill: var(--accent);
    opacity: 0.8;
  }
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 20px; padding: 16px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
  .legend-swatch { width: 14px; height: 14px; border-radius: 4px; }
  .flow-tag {
    display: inline-block;
    padding: 2px 6px;
    margin-left: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
  }
  @media (max-width: 768px) {
    body { padding: 16px 12px; }
    .header h1 { font-size: 22px; }
    .arch-svg { min-width: 720px; }
    .container { overflow-x: auto; }
  }

  /* === Return-to-homepage floating button === */
  .topbar-back {
    position: fixed;
    top: 18px;
    right: 24px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    color: var(--accent);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    text-decoration: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    transition: background 150ms, border-color 150ms, transform 150ms;
  }
  .topbar-back:hover {
    background: var(--bg-card);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  @media (max-width: 768px) {
    .topbar-back { top: 12px; right: 12px; padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
  <a href="../../showcase/landing.html" class="topbar-back">← 返回主页</a>

<div class="header">
  <span class="badge">extensions/orchestrator</span>
  <h1>三层架构 · Tracker → Orchestrator → Agent Runner</h1>
  <p class="sub">五个适配器接入不同 issue 平台；中间编排器负责状态机、Git 同步、报告双写；底层 Agent Runner 驱动 30 轮以内的 Query 循环。</p>
</div>

<div class="container">
<svg class="arch-svg" viewBox="0 0 1240 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4aa" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a4252" />
    </marker>
  </defs>

  <!-- LAYER 1: TRACKER ADAPTERS -->
  <text x="20" y="34" class="layer-title" style="font-size:11px; letter-spacing:1px; fill:var(--accent);">LAYER 1 · TRACKER ADAPTERS</text>
  <text x="20" y="50" class="layer-sub">Polls issues &amp; posts PRs / comments · 同一抽象接口 · 5 个实现</text>
  <rect x="20" y="70" width="1200" height="100" rx="12" class="layer-card" />
  <g>
    <!-- Linear -->
    <rect x="60" y="92" width="180" height="56" class="component-rect" />
    <text x="150" y="116" class="component-label">Linear</text>
    <text x="150" y="132" class="component-sub">extensions/orchestrator/linear/</text>
    <text x="150" y="143" class="component-sub">GraphQL · Todo/In Progress</text>

    <!-- GitHub -->
    <rect x="270" y="92" width="180" height="56" class="component-rect" />
    <text x="360" y="116" class="component-label">GitHub</text>
    <text x="360" y="132" class="component-sub">extensions/orchestrator/repo_tracker/</text>
    <text x="360" y="143" class="component-sub">REST v3 · open</text>

    <!-- Gitee -->
    <rect x="480" y="92" width="180" height="56" class="component-rect" />
    <text x="570" y="116" class="component-label">Gitee</text>
    <text x="570" y="132" class="component-sub">REST v5 · opened</text>
    <text x="570" y="143" class="component-sub">中文社区</text>

    <!-- GitCode -->
    <rect x="690" y="92" width="180" height="56" class="component-rect" />
    <text x="780" y="116" class="component-label">GitCode</text>
    <text x="780" y="132" class="component-sub">REST v5 · opened</text>
    <text x="780" y="143" class="component-sub">开源协作 · REST v5</text>

    <!-- Local -->
    <rect x="900" y="92" width="180" height="56" class="component-rect" />
    <text x="990" y="116" class="component-label">Local</text>
    <text x="990" y="132" class="component-sub">文件系统 markdown + ndjson</text>
    <text x="990" y="143" class="component-sub">no_push · PENDING_REVIEW</text>
  </g>

  <!-- Arrows from trackers into orchestrator -->
  <line x1="150" y1="148" x2="150" y2="200" class="conn-active" marker-end="url(#arrow)" />
  <line x1="360" y1="148" x2="360" y2="200" class="conn-active" marker-end="url(#arrow)" />
  <line x1="570" y1="148" x2="570" y2="200" class="conn-active" marker-end="url(#arrow)" />
  <line x1="780" y1="148" x2="780" y2="200" class="conn-active" marker-end="url(#arrow)" />
  <line x1="990" y1="148" x2="990" y2="200" class="conn-active" marker-end="url(#arrow)" />

  <!-- LAYER 2: ORCHESTRATOR CORE -->
  <text x="20" y="232" class="layer-title" style="font-size:11px; letter-spacing:1px; fill:var(--accent);">LAYER 2 · ORCHESTRATOR CORE</text>
  <text x="20" y="248" class="layer-sub">13-stage state machine · branch workspace · run agent · git sync · open PR</text>
  <rect x="20" y="268" width="1200" height="220" rx="12" class="layer-card" />

  <g>
    <!-- WorkflowConfig -->
    <rect x="50" y="288" width="160" height="68" class="component-rect" />
    <text x="130" y="312" class="component-label">WorkflowConfig</text>
    <text x="130" y="328" class="component-sub">extensions/orchestrator/</text>
    <text x="130" y="339" class="component-sub">config/schema.py</text>

    <!-- IssueRegistry -->
    <rect x="230" y="288" width="160" height="68" class="component-rect" />
    <text x="310" y="312" class="component-label">IssueRegistry</text>
    <text x="310" y="328" class="component-sub">~/.orchestrator/issue_registry.json</text>
    <text x="310" y="339" class="component-sub">状态: SYNCED/PENDING/FAILED</text>

    <!-- Workspace -->
    <rect x="410" y="288" width="160" height="68" class="component-rect" />
    <text x="490" y="312" class="component-label">Workspace</text>
    <text x="490" y="328" class="component-sub">isolated / shared / sequential</text>
    <text x="490" y="339" class="component-sub">worktree + gitignore 模式</text>

    <!-- HookRunner -->
    <rect x="590" y="288" width="160" height="68" class="component-rect" />
    <text x="670" y="312" class="component-label">HookRunner</text>
    <text x="670" y="328" class="component-sub">after_create/before_run/...</text>
    <text x="670" y="339" class="component-sub">pre_commit/pre_push/post_sync</text>

    <!-- Verification -->
    <rect x="770" y="288" width="160" height="68" class="component-rect" />
    <text x="850" y="312" class="component-label">Verification</text>
    <text x="850" y="328" class="component-sub">三道关卡</text>
    <text x="850" y="339" class="component-sub">test / build / lint</text>

    <!-- GitSyncService -->
    <rect x="950" y="288" width="160" height="68" class="component-rect" />
    <text x="1030" y="312" class="component-label">GitSyncService</text>
    <text x="1030" y="328" class="component-sub">commit → push → rebase</text>
    <text x="1030" y="339" class="component-sub">PR 创建 + body 渲染</text>

    <!-- ReportWriter -->
    <rect x="50" y="376" width="160" height="68" class="component-rect" />
    <text x="130" y="400" class="component-label">ReportWriter</text>
    <text x="130" y="416" class="component-sub">workspace/.reports/</text>
    <text x="130" y="427" class="component-sub">~/.orchestrator/reports/</text>

    <!-- ProgressSink -->
    <rect x="230" y="376" width="160" height="68" class="component-rect" />
    <text x="310" y="400" class="component-label">ProgressSink</text>
    <text x="310" y="416" class="component-sub">Progress Sink · 扇出</text>
    <text x="310" y="427" class="component-sub">sinks: list[ProgressSink]</text>

    <!-- ControlSocket -->
    <rect x="410" y="376" width="160" height="68" class="component-rect" />
    <text x="490" y="400" class="component-label">ControlSocket</text>
    <text x="490" y="416" class="component-sub">Unix domain socket</text>
    <text x="490" y="427" class="component-sub">pause/resume/inject/stop</text>

    <!-- Intent Resolver -->
    <rect x="590" y="376" width="160" height="68" class="component-rect" />
    <text x="670" y="400" class="component-label">IntentResolver</text>
    <text x="670" y="416" class="component-sub">operator intent</text>
    <text x="670" y="427" class="component-sub">retry/follow-up/blocked/rebase</text>

    <!-- Review Feedback -->
    <rect x="770" y="376" width="160" height="68" class="component-rect" />
    <text x="850" y="400" class="component-label">ReviewFeedback</text>
    <text x="850" y="416" class="component-sub">PR 评论扫描</text>
    <text x="850" y="427" class="component-sub">CI 失败 + inline review</text>

    <!-- Backoff -->
    <rect x="950" y="376" width="160" height="68" class="component-rect" />
    <text x="1030" y="400" class="component-label">BackoffStrategy</text>
    <text x="1030" y="416" class="component-sub">429-aware</text>
    <text x="1030" y="427" class="component-sub">in-turn + inter-run</text>
  </g>

  <!-- Arrow down to agent runner -->
  <line x1="620" y1="444" x2="620" y2="540" class="conn-active" marker-end="url(#arrow)" />
  <text x="635" y="490" class="conn-label">run_agent →</text>

  <!-- LAYER 3: AGENT RUNNER -->
  <text x="20" y="572" class="layer-title" style="font-size:11px; letter-spacing:1px; fill:var(--accent);">LAYER 3 · AGENT RUNNER</text>
  <text x="20" y="588" class="layer-sub">30-turn QueryRunner 循环 · 工具调用 · 流事件 → Session 持久化</text>
  <rect x="20" y="608" width="1200" height="92" rx="12" class="layer-card" />

  <g>
    <rect x="60" y="624" width="220" height="60" class="component-rect" />
    <text x="170" y="650" class="component-label">AgentRunner.run(issue)</text>
    <text x="170" y="666" class="component-sub">prompt builder · workspace cwd</text>
    <text x="170" y="677" class="component-sub">Jinja-like placeholder rendering</text>

    <rect x="310" y="624" width="220" height="60" class="component-rect" />
    <text x="420" y="650" class="component-label">QueryRunner.stream()</text>
    <text x="420" y="666" class="component-sub">LiteLLM · 100+ providers</text>
    <text x="420" y="677" class="component-sub">TextDelta / ToolCall / ToolResult</text>

    <rect x="560" y="624" width="220" height="60" class="component-rect" />
    <text x="670" y="650" class="component-label">Tool Execution</text>
    <text x="670" y="666" class="component-sub">Bash · Read · Edit · Grep · Glob</text>
    <text x="670" y="677" class="component-sub">approval policy · 工具权限</text>

    <rect x="810" y="624" width="200" height="60" class="component-rect" />
    <text x="910" y="650" class="component-label">SessionStorage</text>
    <text x="910" y="666" class="component-sub">~/.orchestrator/sessions/{run_id}/</text>
    <text x="910" y="677" class="component-sub">metadata.json + transcript.jsonl</text>

    <rect x="1040" y="624" width="160" height="60" class="component-rect" />
    <text x="1120" y="650" class="component-label">debug.ndjson</text>
    <text x="1120" y="666" class="component-sub">turn/tool counters</text>
    <text x="1120" y="677" class="component-sub">heartbeat · watchdog</text>
  </g>

  <!-- Return arrow back to git sync -->
  <path d="M 620 540 Q 620 510 1050 510 Q 1180 510 1180 444 Q 1180 420 1110 420" class="conn-line" marker-end="url(#arrow-dim)" stroke-dasharray="3 3" />
  <text x="1192" y="490" class="conn-label" text-anchor="end">commit →</text>
</svg>

<div class="legend">
  <div class="legend-item">
    <span class="legend-swatch" style="background:var(--accent);"></span>
    主数据流（active · 实线 + 流动 dash）
  </div>
  <div class="legend-item">
    <span class="legend-swatch" style="background:var(--border-strong);"></span>
    控制流（虚线）
  </div>
  <div class="legend-item">
    <span class="legend-swatch" style="background:var(--bg-elevated); border:1px solid var(--border-strong);"></span>
    可独立替换/扩展的组件
  </div>
  <div class="legend-item">
    <span class="flow-tag">extensions/orchestrator/</span>
    扩展层（非侵入式）
  </div>
</div>
</div>
</body>
</html>
